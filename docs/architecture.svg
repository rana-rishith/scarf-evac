<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Calibri, Arial, sans-serif">
  <title>SCARF architecture</title>
  <desc>The ward instance feeds the SCARF solver, which produces a plan; the ledger serves the solver, the verifier checks the plan, and a separate exact solver measures how far from optimal the plan is.</desc>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A6A60"/>
    </marker>
  </defs>

  <rect width="980" height="540" fill="#FFFFFF"/>

  <!-- ============ main pipeline ============ -->

  <!-- Instance -->
  <rect x="30" y="70" width="210" height="130" rx="8" fill="#F3EDE7" stroke="#C9BCB2" stroke-width="1.5"/>
  <text x="48" y="99" font-size="19" font-weight="bold" fill="#2A2522">Instance</text>
  <text x="48" y="118" font-size="11.5" fill="#7A6A60">scarf/model.py</text>
  <text x="48" y="143" font-size="13" fill="#2A2522">Vertices, arcs, cohorts</text>
  <text x="48" y="162" font-size="13" fill="#2A2522">Hazard sources, staff</text>
  <text x="48" y="181" font-size="13" fill="#B8402F">validate() guards it</text>

  <!-- SCARF -->
  <rect x="290" y="30" width="330" height="210" rx="8" fill="#B8402F"/>
  <text x="312" y="64" font-size="22" font-weight="bold" fill="#FFFFFF">SCARF</text>
  <text x="312" y="83" font-size="11.5" fill="#F6D9D3">scarf/solver.py</text>
  <text x="312" y="112" font-size="13" fill="#FFFFFF">0  Precompute: deadlines, trips</text>
  <text x="312" y="134" font-size="13" fill="#FFFFFF">1  Pre-screen: reachability, bound</text>
  <text x="312" y="156" font-size="13" fill="#FFFFFF">2  Dispatch: acuity-ranked, escorted</text>
  <text x="312" y="178" font-size="13" fill="#FFFFFF">3  Re-dispatch: penalise, repair</text>
  <text x="312" y="200" font-size="13" fill="#FFFFFF">4  Re-plan: the hazard moved</text>
  <text x="312" y="226" font-size="12" font-style="italic" fill="#F6D9D3">escort position is part of the label</text>

  <!-- Plan -->
  <rect x="670" y="70" width="280" height="130" rx="8" fill="#2A2522"/>
  <text x="690" y="99" font-size="19" font-weight="bold" fill="#FFFFFF">Plan</text>
  <text x="690" y="118" font-size="11.5" fill="#D98324">O = (φ, R, A, f, Θ, B)</text>
  <text x="690" y="143" font-size="13" fill="#FFFFFF">Routes, start times, escorts</text>
  <text x="690" y="162" font-size="13" fill="#FFFFFF">Clearance time + lower bound</text>
  <text x="690" y="181" font-size="13" fill="#FFFFFF">Bottleneck arcs to widen</text>

  <!-- ============ supporting row ============ -->

  <!-- Wards -->
  <rect x="30" y="300" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#C9BCB2" stroke-width="1.5"/>
  <text x="48" y="330" font-size="17" font-weight="bold" fill="#2A2522">Ward data</text>
  <text x="48" y="349" font-size="11.5" fill="#7A6A60">data/wards.py</text>
  <text x="48" y="374" font-size="13" fill="#2A2522">3 published layouts</text>
  <text x="48" y="393" font-size="13" fill="#2A2522">generator to 1920 beds</text>

  <!-- Ledger -->
  <rect x="290" y="300" width="330" height="120" rx="8" fill="#FDF2E4" stroke="#D98324" stroke-width="1.5"/>
  <text x="312" y="330" font-size="17" font-weight="bold" fill="#2A2522">Ledger</text>
  <text x="312" y="349" font-size="11.5" fill="#7A6A60">scarf/ledger.py</text>
  <text x="312" y="374" font-size="13" fill="#2A2522">Reservations on (place, slot)</text>
  <text x="312" y="393" font-size="13" fill="#2A2522">Escort pool, hazard deadlines</text>

  <!-- verify -->
  <rect x="670" y="300" width="280" height="120" rx="8" fill="#F1F5EC" stroke="#6B8E4E" stroke-width="1.5"/>
  <text x="690" y="330" font-size="17" font-weight="bold" fill="#2A2522">Verifier</text>
  <text x="690" y="349" font-size="11.5" fill="#7A6A60">scarf/verify.py</text>
  <text x="690" y="374" font-size="13" fill="#2A2522">Re-derives all 8 rules</text>
  <text x="690" y="393" font-size="13" fill="#2A2522">from the moves alone</text>

  <!-- ============ arrows ============ -->
  <line x1="243" y1="135" x2="283" y2="135" stroke="#7A6A60" stroke-width="2" marker-end="url(#head)"/>
  <line x1="623" y1="135" x2="663" y2="135" stroke="#7A6A60" stroke-width="2" marker-end="url(#head)"/>
  <line x1="135" y1="297" x2="135" y2="207" stroke="#7A6A60" stroke-width="2" marker-end="url(#head)"/>
  <line x1="810" y1="203" x2="810" y2="293" stroke="#7A6A60" stroke-width="2" marker-end="url(#head)"/>
  <line x1="455" y1="297" x2="455" y2="247" stroke="#7A6A60" stroke-width="2" marker-end="url(#head)"/>
  <line x1="455" y1="243" x2="455" y2="293" stroke="#7A6A60" stroke-width="2" marker-end="url(#head)"/>

  <!-- ============ measurement band ============ -->
  <line x1="30" y1="452" x2="950" y2="452" stroke="#C9BCB2" stroke-width="1"/>
  <text x="30" y="482" font-size="15" font-weight="bold" fill="#2A2522">Measured, not asserted</text>
  <text x="30" y="504" font-size="13" fill="#2A2522">bench/exact.py solves 22 small instances outright. SCARF matches the optimum on every one, and the bound averages 88% of it.</text>
  <text x="30" y="525" font-size="12" font-style="italic" fill="#7A6A60">Zero runtime dependencies. The verifier shares no bookkeeping with the solver, so agreement means something.</text>
</svg>
